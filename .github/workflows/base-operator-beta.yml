name: BASE Operator Beta ZIP
on:
  push:
    branches: [base/workspace-dev]
    paths:
      - 'flecity_base/**'
      - '.github/workflows/base-operator-beta.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build and verify operator beta ZIP
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, pathlib, shutil, zipfile, re, subprocess
          src=pathlib.Path('flecity_base')
          dist=pathlib.Path('dist')
          stage=dist/'BASE_operator_stage'
          output=stage/'flecity_base'
          dist.mkdir(exist_ok=True)
          if stage.exists(): shutil.rmtree(stage)
          output.mkdir(parents=True)
          included=['fxmanifest.lua','config.lua','client','server','web','sql','README.md','ACCESS.md','OPERATOR_GUIDE.md']
          for name in included:
              p=src/name
              if not p.exists(): raise RuntimeError(f'Missing BASE component: {name}')
              dest=output/name
              if p.is_dir(): shutil.copytree(p,dest)
              else: shutil.copy2(p,dest)
          manifest=(output/'fxmanifest.lua').read_text('utf-8')
          version=re.search(r"(?m)^version '(\d+\.\d+\.\d+)-dev'$",manifest)
          if not version: raise RuntimeError('BASE dev version not recognized')
          release=version.group(1)+'-beta.1'
          manifest=manifest.replace(f"version '{version.group(1)}-dev'",f"version '{release}'")
          (output/'fxmanifest.lua').write_text(manifest,'utf-8')
          cfg=(output/'config.lua').read_text('utf-8')
          for marker in ("identifier = 'flecity_base'","name = 'BASE'","price = 0","supportDefault = false"):
              if marker not in cfg: raise RuntimeError(f'Invalid BASE safety config: {marker}')
          cfg=re.sub(r'(?m)^FlecityBaseConfig.Debug\s*=\s*(?:true|false)\s*$', 'FlecityBaseConfig.Debug = false',cfg)
          if 'FlecityBaseConfig.Debug = false' not in cfg: raise RuntimeError('Debug mode was not disabled')
          (output/'config.lua').write_text(cfg,'utf-8')
          if re.search(r'(?<![A-Za-z])\d+(?:\.\d+)?px',(output/'web/app.css').read_text('utf-8')):
              raise RuntimeError('LB Phone fixBlur incompatible CSS')
          subprocess.run(['node','--check',str(output/'web/app.js')],check=True)
          (stage/'はじめにお読みください.txt').write_text("""BASE | 運営様への初回提出（先行公開β版）

          こちらはLB Phone用共有管理アプリ「BASE」の単独導入パッケージです。
          LOOPやLINKは含まれません。

          メモ・在庫の記録・タスク・会計の記録・計算ツールを、
          個人／企業／グループ内で共有することができます。
          メンバー招待、OWNER / MANAGER / MEMBERの権限があります。

          会計・在庫はBASE内だけの記録で、
          実際の銀行口座やox_inventoryのアイテムは変更しません。
          既存のQBox、LB Phone、他アプリのファイルも変更しません。

          β公開後に住民からの不具合・改善要望を集めて改善する予定です。
          詳細は同梱の「運営向け導入手順.txt」をご覧ください。
          """,'utf-8')
          (stage/'運営向け導入手順.txt').write_text("""BASE | 運営様向け導入手順

          対象環境：Flecity QBox 2.5.4 / oxmysql / LB Phone 2.9.0
          プレイヤー識別：citizenid

          1. ZIP内の「flecity_base」フォルダをresources配下へ配置します。
          2. qbx_core / oxmysql / lb-phoneの起動より後に、
             server.cfgへ次の1行を追加してください。

          ensure flecity_base

          3. 初回導入でサーバーを稼働させている場合は
             txAdmin Live Consoleで次を実行してください。

          refresh
          ensure flecity_base

          4. 続けて以下の確認用コマンドを実行してください。

          base_selftest

          PASSの確認と、LB Phone App Storeで「BASE」が無料表示されることを
          確認できれば基本導入は完了です。サーバー全体の再起動は原則不要です。

          ・DBテーブルは起動時に自動作成・移行します。
          ・実際の銀行残高やインベントリは操作しません。
          ・WEAZELサポート権限は初期OFFです。
          ・管理ACEは任意です。詳細はflecity_base/ACCESS.mdをご参照ください。
            例：add_ace group.admin flecity.base.admin allow

          停止する場合は「stop flecity_base」を実行し、
          server.cfgの「ensure flecity_base」を削除・コメントアウトしてください。
          既存のBASE記録は自動で消去されません。

          初回提出・β公開として住民の意見を受け、修正版を別途提出します。
          """,'utf-8')
          commit=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          (stage/'ビルド情報.txt').write_text(f'BASE {release}\nSource commit: {commit}\nBeta operator submission\nDebug: disabled\n','utf-8')
          path=dist/f'BASE-v{release}-運営提出用.zip'
          with zipfile.ZipFile(path,'w',zipfile.ZIP_DEFLATED,compresslevel=9) as z:
              for file in sorted(stage.rglob('*')):
                  if file.is_file(): z.write(file,file.relative_to(stage).as_posix())
          with zipfile.ZipFile(path) as z:
              names=set(z.namelist())
              for name in ['flecity_base/fxmanifest.lua','flecity_base/config.lua','flecity_base/web/app.js','flecity_base/web/icon.webp','flecity_base/server/main.lua','はじめにお読みください.txt','運営向け導入手順.txt']:
                  if name not in names: raise RuntimeError(f'Missing release file: {name}')
          digest=hashlib.sha256(path.read_bytes()).hexdigest()
          (dist/'BASE_SHA256.txt').write_text(f'{digest}  {path.name}\n','utf-8')
          print(f'Release: {path}, checksum: {digest}, source: {commit}')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: BASE-v0.10.0-beta.1-operator
          path: |
            dist/BASE-v*.zip
            dist/BASE_SHA256.txt
          if-no-files-found: error
          retention-days: 30
