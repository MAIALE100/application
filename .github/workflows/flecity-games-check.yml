name: Flecity Games Static Check

on:
  push:
    branches:
      - games/platform-core
    paths:
      - 'flecity_games/**'
      - 'games-update.ps1'
      - 'games-update.cmd'
      - 'games-manual-update.ps1'
      - 'games-auto-update.ps1'
      - 'games-auto-update-once.ps1'
      - 'games-auto-update-install.ps1'
      - 'games-auto-update-install.cmd'
      - 'games-auto-update-disable.ps1'
      - 'games-auto-update-disable.cmd'
      - 'games-auto-update-status.ps1'
      - 'games-auto-update-status.cmd'
      - '.github/workflows/flecity-games-check.yml'
  pull_request:
    paths:
      - 'flecity_games/**'
      - 'games-update.ps1'
      - 'games-update.cmd'
      - 'games-manual-update.ps1'
      - 'games-auto-update.ps1'
      - 'games-auto-update-once.ps1'
      - 'games-auto-update-install.ps1'
      - 'games-auto-update-install.cmd'
      - 'games-auto-update-disable.ps1'
      - 'games-auto-update-disable.cmd'
      - 'games-auto-update-status.ps1'
      - 'games-auto-update-status.cmd'
      - '.github/workflows/flecity-games-check.yml'

jobs:
  static-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check change isolation
        shell: bash
        run: |
          git fetch origin frame-integration-test
          bad=0
          while IFS= read -r path; do
            case "$path" in
              flecity_games/*|games-update.ps1|games-update.cmd|games-manual-update.ps1|games-auto-update.ps1|games-auto-update-once.ps1|games-auto-update-install.ps1|games-auto-update-install.cmd|games-auto-update-disable.ps1|games-auto-update-disable.cmd|games-auto-update-status.ps1|games-auto-update-status.cmd|.github/workflows/flecity-games-check.yml)
                ;;
              *)
                echo "Unexpected path changed outside Flecity Games: $path"
                bad=1
                ;;
            esac
          done < <(git diff --name-only origin/frame-integration-test...HEAD)
          exit "$bad"

      - name: Check games-update PowerShell syntax
        shell: pwsh
        run: |
          $null = [ScriptBlock]::Create((Get-Content -Raw games-update.ps1))
          $null = [ScriptBlock]::Create((Get-Content -Raw games-manual-update.ps1))
      - name: Check legacy watcher PowerShell syntax
        shell: pwsh
        run: |
          $null = [ScriptBlock]::Create((Get-Content -Raw games-auto-update.ps1))
      - name: Check one-shot updater PowerShell syntax
        shell: pwsh
        run: |
          $null = [ScriptBlock]::Create((Get-Content -Raw games-auto-update-once.ps1))
      - name: Check installer PowerShell syntax
        shell: pwsh
        run: |
          $null = [ScriptBlock]::Create((Get-Content -Raw games-auto-update-install.ps1))
      - name: Check disable/status PowerShell syntax
        shell: pwsh
        run: |
          $null = [ScriptBlock]::Create((Get-Content -Raw games-auto-update-disable.ps1))
          $null = [ScriptBlock]::Create((Get-Content -Raw games-auto-update-status.ps1))
      - name: Check updater command launchers
        shell: pwsh
        run: |
          if ((Get-Content -Raw games-update.cmd) -notmatch 'games-update\.ps1') { throw 'games-update.cmd does not launch games-update.ps1' }
          if ((Get-Content -Raw games-auto-update-install.cmd) -notmatch 'games-auto-update-install\.ps1') { throw 'install cmd does not launch installer' }
          if ((Get-Content -Raw games-auto-update-disable.cmd) -notmatch 'games-auto-update-disable\.ps1') { throw 'disable cmd does not launch disable script' }
          if ((Get-Content -Raw games-auto-update-status.cmd) -notmatch 'games-auto-update-status\.ps1') { throw 'status cmd does not launch status script' }

      - name: Check JavaScript syntax
        run: |
          node --check flecity_games/web/shared/errors.js
          node --check flecity_games/web/shared/bridge.js
          node --check flecity_games/web/play/app.js
          node --check flecity_games/web/party/app.js

      - name: Install Lua
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.4

      - name: Check Lua syntax
        run: |
          find flecity_games -type f -name '*.lua' -print0 | xargs -0 -n1 luac5.4 -p

      - name: Check Flecity Games wiring
        run: python3 flecity_games/tools/static_check.py
