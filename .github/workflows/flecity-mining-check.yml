name: Flecity Mining Static Check

on:
  push:
    branches:
      - jobs/mining-dev
    paths:
      - 'flecity_mining/**'
      - 'MINING_HANDOFF.md'
      - '.github/workflows/flecity-mining-check.yml'
  pull_request:
    paths:
      - 'flecity_mining/**'
      - 'MINING_HANDOFF.md'
      - '.github/workflows/flecity-mining-check.yml'

jobs:
  static-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Lua 5.4
        run: |
          sudo apt-get update -y
          sudo apt-get install -y lua5.4

      - name: Check Lua syntax
        run: |
          set -euo pipefail
          find flecity_mining -type f -name '*.lua' -print0 | xargs -0 -n1 luac5.4 -p

      - name: Check required files
        run: |
          set -euo pipefail
          test -f flecity_mining/fxmanifest.lua
          test -f flecity_mining/config/gameplay.lua
          test -f flecity_mining/config/economy.lua
          test -f flecity_mining/config/locations.lua
          test -f flecity_mining/OPERATIONS.md
          test -f flecity_mining/client/main.lua
          test -f flecity_mining/server/main.lua
          test -f flecity_mining/README.md
          test -f flecity_mining/TESTING.md

      - name: Check beginner-safe design invariants
        run: |
          set -euo pipefail
          grep -q "dependency 'qbx_core'" flecity_mining/fxmanifest.lua
          grep -q "Config.MaxRawOre" flecity_mining/config/gameplay.lua
          grep -q "Config.Economy" flecity_mining/config/economy.lua
          grep -q "Config.Foreman" flecity_mining/config/locations.lua
          grep -q "exports.qbx_core:AddMoney" flecity_mining/server/main.lua
          ! grep -RniE 'mining(level|xp)|miner(level|xp)' flecity_mining --include='*.lua'
          grep -q "server/selftest.lua" flecity_mining/fxmanifest.lua
          grep -q "mining_configcheck" flecity_mining/server/main.lua
          grep -q "mining_economy" flecity_mining/server/main.lua

      - name: Check operator config isolation
        run: |
          set -euo pipefail
          grep -q "config/gameplay.lua" flecity_mining/fxmanifest.lua
          grep -q "config/economy.lua" flecity_mining/fxmanifest.lua
          grep -q "config/locations.lua" flecity_mining/fxmanifest.lua
          ! grep -RniE 'value[[:space:]]*=[[:space:]]*[0-9]+' flecity_mining/server flecity_mining/client --include='*.lua'
