name: FLEPURI v1.0.0 submission package

on:
  push:
    branches:
      - release/flepri-v1.0.0
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4

      - name: Validate submission
        shell: bash
        run: |
          set -euo pipefail
          test -f puribooth/fxmanifest.lua
          test -f puribooth/client/main.lua
          test -f puribooth/server/main.lua
          test -f puribooth/ui/app.js
          test -f puribooth/INSTALL.md
          test -f puribooth/ACCEPTANCE_TEST.md
          grep -q 'version "1.0.0"' puribooth/fxmanifest.lua
          node --check puribooth/ui/app.js
          if find puribooth -type f \( -iname '*.ttf' -o -iname '*.otf' -o -iname '*.woff' -o -iname '*.woff2' -o -iname '*.eot' \) | grep -q .; then
            echo "Font binary found in submission tree; aborting."
            exit 1
          fi

      - name: Stage operator package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp -a puribooth dist/puribooth
          find dist -name '.DS_Store' -delete
          find dist -name 'Thumbs.db' -delete

      - name: Upload FLEPURI submission ZIP
        uses: actions/upload-artifact@v4
        with:
          name: FLEPURI_v1.0.0_submission
          path: dist/
          compression-level: 9
          retention-days: 30
          if-no-files-found: error
