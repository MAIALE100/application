name: PuriPhoto Booth Build

on:
  push:
    branches:
      - puriphoto/booth-dev
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install PuriPhoto UI dependencies
        working-directory: puriphoto/ui
        run: npm ci

      - name: Build PuriPhoto UI
        working-directory: puriphoto/ui
        run: npm run build

      - name: Validate booth JavaScript
        run: node --check puribooth/ui/app.js
