name: WAVE Static Check

on:
  push:
    branches:
      - wave/dev
    paths:
      - 'wave-package.part*'
      - 'wave-v022-app.part*'
      - 'wave-v030-patchb64.part00'
      - 'wave-v030-patchb64.part01'
      - 'wave-v030-patchb64.part02'
      - 'wave-v030-patchb64.part03'
      - 'wave-v030-patchb64.part04'
      - 'wave-v030-patchb64.part05'
      - 'wave-v030-atomic-status.patch'
      - 'wave-v030-idempotent-saves.patch'
      - 'wave-v030-rate-limit.patch'
      - 'wave-update.ps1'
      - 'wave-update-noop-test.ps1'
      - 'wave-update-lock-test.ps1'
      - 'wave-update-source-pin-test.ps1'
      - 'wave-update-retention-test.ps1'
      - 'wave-update-path-safety-test.ps1'
      - 'wave-update-preflight-test.ps1'
      - 'wave-update.cmd'
      - 'wave-security-smoke.py'
      - 'wave-save-idempotency-test.lua'
      - 'wave-rate-limit-test.lua'
      - '.github/workflows/wave-check.yml'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct WAVE v0.3.0
        shell: bash
        run: |
          set -euo pipefail
          cat wave-package.part00 wave-package.part01 wave-package.part02 wave-package.part03 \
              wave-package.part04 wave-package.part05 wave-package.part06 \
              wave-package.part07a wave-package.part07b wave-package.part07c wave-package.part07d \
              wave-package.part07e wave-package.part07f wave-package.part07g wave-package.part08 \
              | base64 -d > wave-base.zip
          echo "34a84f4575f09ced45a58ef390272f9794f4d7cdcc548024a48fe5f899e16850  wave-base.zip" | sha256sum -c -
          unzip -q wave-base.zip -d wave-check
          cat wave-v022-app.part00 wave-v022-app.part01 wave-v022-app.part02 | base64 -d | gzip -d > wave-check/wave/web/app.js
          echo "1ce2c985ab072db4f1c2b9c3d2194525ef619ff8456b154ae2de18f513602262  wave-check/wave/web/app.js" | sha256sum -c -
          sed -i "s/version '0.2.0-test'/version '0.2.2-test'/" wave-check/wave/fxmanifest.lua
          cat wave-v030-patchb64.part00 wave-v030-patchb64.part01 wave-v030-patchb64.part02 \
              wave-v030-patchb64.part03 wave-v030-patchb64.part04 wave-v030-patchb64.part05 \
              | base64 -d > wave-v030.patch
          echo "6a91d4cdefa0332119d00a1f72b6e3fda0e54edbf4564a716ddf0dc9ac65fafe  wave-v030.patch" | sha256sum -c -
          (cd wave-check/wave && git apply --check --whitespace=nowarn ../../wave-v030.patch && git apply --whitespace=nowarn ../../wave-v030.patch)
          echo "bdd7caf2ee949a52e208e4e9035c37771f22cf504ef460d3096ffe41cb0d6508  wave-v030-atomic-status.patch" | sha256sum -c -
          (cd wave-check/wave && git apply --check --whitespace=nowarn ../../wave-v030-atomic-status.patch && git apply --whitespace=nowarn ../../wave-v030-atomic-status.patch)
          echo "86f20ce3f4c47954930edbb1ef6f6c207d4b855692b542dbf4c26edc0a7189e9  wave-v030-idempotent-saves.patch" | sha256sum -c -
          (cd wave-check/wave && git apply --check --whitespace=nowarn ../../wave-v030-idempotent-saves.patch && git apply --whitespace=nowarn ../../wave-v030-idempotent-saves.patch)
          echo "1aea1cb697e45917dbb001eeaf6a48eb40288a28cdc6233524fcd506b730340a  wave-v030-rate-limit.patch" | sha256sum -c -
          (cd wave-check/wave && git apply --check --whitespace=nowarn ../../wave-v030-rate-limit.patch && git apply --whitespace=nowarn ../../wave-v030-rate-limit.patch)

      - name: Check PowerShell updater syntax
        shell: pwsh
        run: |
          $script = Get-Content -Raw wave-update.ps1
          $null = [ScriptBlock]::Create($script)
          if ($script -match '[^\x00-\x7F]') { throw 'WAVE updater must remain ASCII for Windows PowerShell 5.1' }
          if ($script -notmatch 'ExpectedPatchSha256') { throw 'Patch integrity check missing' }
          if ($script -notmatch 'function Test-DeploymentMatches' -or $script -notmatch 'Deployment verification: PASS \(unchanged\)') { throw 'No-op deployment guard missing' }
          if ($script -notmatch 'Get-FileHash -LiteralPath \$installed') { throw 'No-op guard must compare deployed file hashes' }
          if ($script -notmatch 'Staging verification: PASS' -or $script -notmatch 'Backup verification: PASS') { throw 'Pre-deployment copy verification missing' }
          if ($script -notmatch 'Restored WAVE resource failed hash verification') { throw 'Rollback integrity verification missing' }
          if ($script -notmatch 'function Enter-UpdateLock' -or $script -notmatch '\$UpdateLock\.Dispose\(\)') { throw 'Exclusive updater lock missing' }

      - name: Test no-op deployment safety
        shell: pwsh
        run: |
          ./wave-update-noop-test.ps1

      - name: Test exclusive update lock
        shell: pwsh
        run: |
          ./wave-update-lock-test.ps1

      - name: Test immutable source commit pinning
        shell: pwsh
        run: |
          ./wave-update-source-pin-test.ps1

      - name: Test safe backup retention
        shell: pwsh
        run: |
          ./wave-update-retention-test.ps1

      - name: Test WAVE path safety
        shell: pwsh
        run: |
          ./wave-update-path-safety-test.ps1

      - name: Test deployment preflight against concurrent changes
        shell: pwsh
        run: |
          ./wave-update-preflight-test.ps1

      - name: Check JavaScript and LB Phone constraints
        shell: bash
        run: |
          set -euo pipefail
          node --check wave-check/wave/web/app.js
          ! grep -P '\b(prompt|confirm)\s*\(' wave-check/wave/web/app.js
          ! grep -P '(?<![A-Za-z0-9_-])-?\d*\.?\d+px\b' wave-check/wave/web/app.css
          grep -q "version '0.3.0-test'" wave-check/wave/fxmanifest.lua
          grep -q 'WAVE_PUBLISH_DIAGNOSTICS_V023' wave-check/wave/web/app.js
          grep -q 'requestId' wave-check/wave/web/app.js
          grep -q 'SchemaVersion = 3' wave-check/wave/config/shared.lua
          grep -q 'wave_schema_meta' wave-check/wave/server/main.lua
          grep -q 'Atomic status predicates' wave-check/wave/server/main.lua
          grep -q 'ERROR_TEXT.TRACK_STATE_CHANGED' wave-check/wave/web/app.js
          grep -q 'A no-op UPDATE can report zero affected rows' wave-check/wave/server/main.lua
          grep -q 'Re-saving unchanged metadata' wave-check/wave/server/main.lua
          grep -q 'A new caller must not be throttled at uptime zero' wave-check/wave/server/main.lua
          grep -q "wave:listOwnTracks" wave-check/wave/server/main.lua
          grep -q "wave:updateOwnTrack" wave-check/wave/server/main.lua

      - name: Install Lua
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.4

      - name: Check Lua syntax
        shell: bash
        run: |
          find wave-check/wave -type f -name '*.lua' -print0 | xargs -0 -n1 luac5.4 -p

      - name: Run WAVE Lua save regression tests
        shell: bash
        run: lua5.4 wave-save-idempotency-test.lua wave-check/wave

      - name: Run WAVE rate-limit regression tests
        shell: bash
        run: lua5.4 wave-rate-limit-test.lua wave-check/wave

      - name: Check required files
        shell: bash
        run: |
          test -f wave-check/wave/client/main.lua
          test -f wave-check/wave/server/main.lua
          test -f wave-check/wave/config/shared.lua
          test -f wave-check/wave/web/index.html
          test -f wave-check/wave/web/icon.svg

      - name: Check WAVE security invariants
        shell: bash
        run: python3 wave-security-smoke.py wave-check/wave
