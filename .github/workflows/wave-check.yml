name: WAVE Static Check

on:
  push:
    branches:
      - wave/dev
    paths:
      - 'wave-package.part*'
      - 'wave-v022-app.part*'
      - 'wave-v030-patchb64.part00'
      - 'wave-v030-patchb64.part01'
      - 'wave-v030-patchb64.part02'
      - 'wave-v030-patchb64.part03'
      - 'wave-v030-patchb64.part04'
      - 'wave-v030-patchb64.part05'
      - 'wave-v030-atomic-status.patch'
      - 'wave-v030-patch-chain-test.py'
      - 'wave-v030-idempotent-saves.patch'
      - 'wave-v030-rate-limit.patch'
      - 'wave-v031-release-feedback.patch.b64'
      - 'wave-v032-publish-guard.patch'
      - 'wave-v033-studio-extras.js'
      - 'wave-v035-score-tools.js'
      - 'wave-v035-score-tools-test.js'
      - 'wave-v033-integrity-test.py'
      - 'wave-update.ps1'
      - 'wave-update-noop-test.ps1'
      - 'wave-update-lock-test.ps1'
      - 'wave-update-source-pin-test.ps1'
      - 'wave-update-retention-test.ps1'
      - 'wave-update-path-safety-test.ps1'
      - 'wave-update-preflight-test.ps1'
      - 'wave-update-rollback-test.ps1'
      - 'wave-update.cmd'
      - 'wave-security-smoke.py'
      - 'wave-save-idempotency-test.lua'
      - 'wave-rate-limit-test.lua'
      - '.github/workflows/wave-check.yml'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify studio extras integrity pins
        shell: bash
        run: python3 wave-v033-integrity-test.py

      - name: Test historical patch chain
        shell: bash
        run: python3 wave-v030-patch-chain-test.py

      - name: Reconstruct WAVE base and v0.3.0
        shell: bash
        run: |
          set -euo pipefail
          cat wave-package.part00 wave-package.part01 wave-package.part02 wave-package.part03 \
              wave-package.part04 wave-package.part05 wave-package.part06 \
              wave-package.part07a wave-package.part07b wave-package.part07c wave-package.part07d \
              wave-package.part07e wave-package.part07f wave-package.part07g wave-package.part08 \
              | base64 -d > wave-base.zip
          echo "34a84f4575f09ced45a58ef390272f9794f4d7cdcc548024a48fe5f899e16850  wave-base.zip" | sha256sum -c -
          unzip -q wave-base.zip -d wave-check
          cat wave-v022-app.part00 wave-v022-app.part01 wave-v022-app.part02 | base64 -d | gzip -d > wave-check/wave/web/app.js
          echo "1ce2c985ab072db4f1c2b9c3d2194525ef619ff8456b154ae2de18f513602262  wave-check/wave/web/app.js" | sha256sum -c -
          sed -i "s/version '0.2.0-test'/version '0.2.2-test'/" wave-check/wave/fxmanifest.lua
          cat wave-v030-patchb64.part00 wave-v030-patchb64.part01 wave-v030-patchb64.part02 \
              wave-v030-patchb64.part03 wave-v030-patchb64.part04 wave-v030-patchb64.part05 \
              | base64 -d > wave-v030.patch
          echo "6a91d4cdefa0332119d00a1f72b6e3fda0e54edbf4564a716ddf0dc9ac65fafe  wave-v030.patch" | sha256sum -c -
          # Mirror Windows updater's correction of exactly two malformed CSS hunk context tokens.
          test "$(grep -oF '.album-public-chip spanp{' wave-v030.patch | wc -l)" -eq 2
          sed -i 's/\.album-public-chip spanp{/\.album-public-chip span{/g' wave-v030.patch
          (cd wave-check/wave && git apply --check --whitespace=nowarn ../../wave-v030.patch && git apply --whitespace=nowarn ../../wave-v030.patch)
          echo "c722057b935c55593f29ee574ff2bf68ac2b02ea4e8895230c8f0dd6c5f66609  wave-v030-atomic-status.patch" | sha256sum -c -
          (cd wave-check/wave && git apply --check --whitespace=nowarn ../../wave-v030-atomic-status.patch && git apply --whitespace=nowarn ../../wave-v030-atomic-status.patch)
          echo "86f20ce3f4c47954930edbb1ef6f6c207d4b855692b542dbf4c26edc0a7189e9  wave-v030-idempotent-saves.patch" | sha256sum -c -
          (cd wave-check/wave && git apply --check --whitespace=nowarn ../../wave-v030-idempotent-saves.patch && git apply --whitespace=nowarn ../../wave-v030-idempotent-saves.patch)
          echo "1aea1cb697e45917dbb001eeaf6a48eb40288a28cdc6233524fcd506b730340a  wave-v030-rate-limit.patch" | sha256sum -c -
          (cd wave-check/wave && git apply --check --whitespace=nowarn ../../wave-v030-rate-limit.patch && git apply --whitespace=nowarn ../../wave-v030-rate-limit.patch)

      - name: Apply release feedback diagnostics
        shell: bash
        run: |
          set -euo pipefail
          base64 -d < wave-v031-release-feedback.patch.b64 > wave-v031-feedback.patch
          echo "2c9f73d757b0c04d7698cf48396eeccf4cad54a2ee38247fdb917ef0e6dd0c6c  wave-v031-feedback.patch" | sha256sum -c -
          (cd wave-check/wave && git apply --check --whitespace=nowarn ../../wave-v031-feedback.patch && git apply --whitespace=nowarn ../../wave-v031-feedback.patch)
          sed -i "s/version '0.3.0-test'/version '0.3.1-test'/" wave-check/wave/fxmanifest.lua
      - name: Apply duplicate-release prevention
        shell: bash
        run: |
          set -euo pipefail
          echo "1e1d038401de09efaeb3fe73d3c88bf719572ae687be63a992223b7723487f4b  wave-v032-publish-guard.patch" | sha256sum -c -
          (cd wave-check/wave && git apply --check --whitespace=nowarn ../../wave-v032-publish-guard.patch && git apply --whitespace=nowarn ../../wave-v032-publish-guard.patch)
          sed -i "s/version '0.3.1-test'/version '0.3.2-test'/" wave-check/wave/fxmanifest.lua

      - name: Apply WAVE v0.3.3 studio and library updates
        shell: bash
        run: |
          set -euo pipefail
          echo "689ae752c16f91f9cb11e95a74204043a210bf24658802b50a0543a7308da27b  wave-v033-studio-extras.js" | sha256sum -c -
          cp wave-v033-studio-extras.js wave-check/wave/web/studio-extras.js
          python3 - <<'PY'
          from pathlib import Path
          root = Path("wave-check/wave")
          app = root / "web/app.js"
          text = app.read_text(encoding="utf-8")
          old = "state.ownReleases = r.tracks || [];"
          assert text.count(old) == 1, "Cannot safely hide deleted releases"
          app.write_text(text.replace(old, "state.ownReleases = (r.tracks || []).filter(track => track.status !== 'deleted');"), encoding="utf-8")
          css = root / "web/app.css"
          extra = """
          /* WAVE_STUDIO_PRESETS_V033 */
          html,body,#app,.view,.app,.screen,.content,.page,.card{scrollbar-width:none}
          html::-webkit-scrollbar,body::-webkit-scrollbar,#app::-webkit-scrollbar,.view::-webkit-scrollbar,.app::-webkit-scrollbar,.screen::-webkit-scrollbar,.content::-webkit-scrollbar,.page::-webkit-scrollbar,.card::-webkit-scrollbar{width:0;display:none}
          *::-webkit-scrollbar{width:0!important}
          *::-webkit-scrollbar:vertical{width:0!important;display:none}
          *::-webkit-scrollbar-thumb:vertical{background:transparent}
          .wave-bar-navigator{margin-bottom:.55rem}
          .wave-bar-head{display:flex;justify-content:space-between;gap:.35rem;align-items:center}
          .wave-bar-controls{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:.35rem}
          .wave-bar-steps{display:flex;gap:.22rem;flex-wrap:wrap;margin-top:.35rem}
          .wave-bar-step{min-width:1.8rem}
          .wave-bar-hint{font-size:.63rem;margin-top:.35rem}
          .wave-template-card{margin-bottom:.55rem}
          .wave-template-controls{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:.45rem;margin-top:.4rem}
          .wave-template-controls select{min-width:0}
          .wave-template-controls button{white-space:nowrap}
          .wave-template-info{font-size:.66rem;margin-top:.35rem}
          .wave-template-warning{color:#fecdd3}
          """
          css.write_text(css.read_text(encoding="utf-8") + extra, encoding="utf-8")
          html = root / "web/index.html"
          content = html.read_text(encoding="utf-8")
          assert "</body>" in content
          html.write_text(content.replace("</body>", "  <script src='studio-extras.js'></script>\n</body>"), encoding="utf-8")
          manifest = root / "fxmanifest.lua"
          content = manifest.read_text(encoding="utf-8")
          # The base manifest uses 'web/**/*' and already includes all JS files.
          assert "'web/**/*'" in content
          assert "version '0.3.2-test'" in content
          content = content.replace("version '0.3.2-test'", "version '0.3.4-test'")
          manifest.write_text(content, encoding="utf-8")
          PY

      - name: Apply WAVE long-score quick navigation
        shell: bash
        run: |
          set -euo pipefail
          echo "3fe6fa6e84d7894b8d8ed43a5b5985ce0269a6be440280cbfa1134a86892b806  wave-v035-score-tools.js" | sha256sum -c -
          cp wave-v035-score-tools.js wave-check/wave/web/score-tools.js
          python3 - <<'PY'
          from pathlib import Path
          root = Path("wave-check/wave")
          css = root / "web/app.css"
          extra = """
          .wave-score-quick{display:flex;flex-direction:column;gap:.38rem;margin-top:.5rem}
          .wave-score-quick-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:.35rem;align-items:center}
          .wave-score-quick-row:nth-child(2){grid-template-columns:auto minmax(0,1fr) auto}
          .wave-score-quick-row label{font-size:.68rem}
          .wave-score-quick-row input{min-width:0;max-width:100%;box-sizing:border-box}
          #waveScoreEstimate,#waveScoreMessage{font-size:.66rem;line-height:1.4}
          """
          css.write_text(css.read_text(encoding="utf-8") + extra, encoding="utf-8")
          html = root / "web/index.html"
          content = html.read_text(encoding="utf-8")
          anchor = "<script src='studio-extras.js'></script>"
          assert content.count(anchor) == 1
          html.write_text(content.replace(anchor,anchor + "\n  <script src='score-tools.js'></script>"), encoding="utf-8")
          manifest = root / "fxmanifest.lua"
          text = manifest.read_text(encoding="utf-8")
          assert "version '0.3.4-test'" in text
          manifest.write_text(text.replace("version '0.3.4-test'", "version '0.3.6-test'"), encoding="utf-8")
          PY

      - name: Check PowerShell updater syntax
        shell: pwsh
        run: |
          $script = Get-Content -Raw wave-update.ps1
          $null = [ScriptBlock]::Create($script)
          if ($script -match '[^\x00-\x7F]') { throw 'WAVE updater must remain ASCII for Windows PowerShell 5.1' }
          if ($script -notmatch 'ExpectedPatchSha256') { throw 'Patch integrity check missing' }
          if ($script -notmatch 'function Test-DeploymentMatches' -or $script -notmatch 'Deployment verification: PASS \(unchanged\)') { throw 'No-op deployment guard missing' }
          if ($script -notmatch 'Get-FileHash -LiteralPath \$installed') { throw 'No-op guard must compare deployed file hashes' }
          if ($script -notmatch 'Staging verification: PASS' -or $script -notmatch 'Backup verification: PASS') { throw 'Pre-deployment copy verification missing' }
          if ($script -notmatch 'Restored WAVE resource failed hash verification') { throw 'Rollback integrity verification missing' }
          if ($script -notmatch 'function Enter-UpdateLock' -or $script -notmatch '\$UpdateLock\.Dispose\(\)') { throw 'Exclusive updater lock missing' }

      - name: Test no-op deployment safety
        shell: pwsh
        run: |
          ./wave-update-noop-test.ps1

      - name: Test exclusive update lock
        shell: pwsh
        run: |
          ./wave-update-lock-test.ps1

      - name: Test immutable source commit pinning
        shell: pwsh
        run: |
          ./wave-update-source-pin-test.ps1

      - name: Test safe backup retention
        shell: pwsh
        run: |
          ./wave-update-retention-test.ps1

      - name: Test WAVE path safety
        shell: pwsh
        run: |
          ./wave-update-path-safety-test.ps1

      - name: Test deployment preflight against concurrent changes
        shell: pwsh
        run: |
          ./wave-update-preflight-test.ps1

      - name: Test existing-install rollback ownership
        shell: pwsh
        run: |
          ./wave-update-rollback-test.ps1

      - name: Check JavaScript and LB Phone constraints
        shell: bash
        run: |
          set -euo pipefail
          node --check wave-check/wave/web/app.js
          node --check wave-check/wave/web/studio-extras.js
          node --check wave-check/wave/web/score-tools.js
          node wave-v035-score-tools-test.js
          ! grep -P '\b(prompt|confirm)\s*\(' wave-check/wave/web/app.js
          ! grep -P '(?<![A-Za-z0-9_-])-?\d*\.?\d+px\b' wave-check/wave/web/app.css
          grep -q "version '0.3.6-test'" wave-check/wave/fxmanifest.lua
          grep -q 'WAVE_LONG_SCORE_TOOLS_V035' wave-check/wave/web/score-tools.js
          grep -q 'WAVE_RANGE_EDIT_V036' wave-check/wave/web/score-tools.js
          grep -q 'score-tools.js' wave-check/wave/web/index.html
          grep -q 'WAVE_BAR_NAVIGATOR_V034' wave-check/wave/web/studio-extras.js
          grep -qF '*::-webkit-scrollbar{width:0!important}' wave-check/wave/web/app.css
          grep -q 'WAVE_STUDIO_PRESETS_V033' wave-check/wave/web/studio-extras.js
          grep -q 'studio-extras.js' wave-check/wave/web/index.html
          grep -qF "'web/**/*'" wave-check/wave/fxmanifest.lua
          grep -q "track.status !== 'deleted'" wave-check/wave/web/app.js
          grep -q 'publishingProjects\[key\] = nil' wave-check/wave/server/main.lua
          grep -q 'ERROR_TEXT.PROJECT_ALREADY_RELEASED' wave-check/wave/web/app.js
          grep -q 'WAVE_RELEASE_ACTION_FEEDBACK_V031' wave-check/wave/web/app.js
          grep -q 'ownReleaseFeedback' wave-check/wave/web/app.js
          grep -q 'WAVE_PUBLISH_DIAGNOSTICS_V023' wave-check/wave/web/app.js
          grep -q 'requestId' wave-check/wave/web/app.js
          grep -q 'SchemaVersion = 3' wave-check/wave/config/shared.lua
          grep -q 'wave_schema_meta' wave-check/wave/server/main.lua
          grep -q 'Atomic status predicates' wave-check/wave/server/main.lua
          grep -q 'ERROR_TEXT.TRACK_STATE_CHANGED' wave-check/wave/web/app.js
          grep -q 'A no-op UPDATE can report zero affected rows' wave-check/wave/server/main.lua
          grep -q 'Re-saving unchanged metadata' wave-check/wave/server/main.lua
          grep -q 'A new caller must not be throttled at uptime zero' wave-check/wave/server/main.lua
          grep -q "wave:listOwnTracks" wave-check/wave/server/main.lua
          grep -q "wave:updateOwnTrack" wave-check/wave/server/main.lua

      - name: Install Lua
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.4

      - name: Check Lua syntax
        shell: bash
        run: |
          find wave-check/wave -type f -name '*.lua' -print0 | xargs -0 -n1 luac5.4 -p

      - name: Run WAVE Lua save regression tests
        shell: bash
        run: lua5.4 wave-save-idempotency-test.lua wave-check/wave

      - name: Run WAVE rate-limit regression tests
        shell: bash
        run: lua5.4 wave-rate-limit-test.lua wave-check/wave

      - name: Check required files
        shell: bash
        run: |
          test -f wave-check/wave/client/main.lua
          test -f wave-check/wave/server/main.lua
          test -f wave-check/wave/config/shared.lua
          test -f wave-check/wave/web/index.html
          test -f wave-check/wave/web/icon.svg

      - name: Check WAVE security invariants
        shell: bash
        run: python3 wave-security-smoke.py wave-check/wave
