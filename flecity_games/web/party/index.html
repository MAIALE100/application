<!doctype html>
<html lang="ja">
<head><meta charset="UTF-8"><title>PARTY</title><link rel="stylesheet" href="../shared/app.css"></head>
<body>
<main class="wrap">
<header class="header app-header"><div><div class="brand-line"><span class="brand-dot"></span><span class="kicker">PLAY TOGETHER.</span></div><h1>PARTY</h1><div class="muted">同じルームで、そのまま次のゲームへ。</div></div></header>
<section id="status" class="status app-status">ルームを作成するか、参加してください。</section>
<section id="entry" class="card stack party-entry"><div><div class="kicker">QUICK START</div><h2>友達と遊ぶ</h2><p class="muted">1人がルームを作成し、ほかの人はコードで参加します。</p></div><button id="create" class="party-primary">ルームを作成</button><div class="join-row"><input id="code" inputmode="numeric" maxlength="4" placeholder="ルームコード"><button id="join" class="secondary">参加</button></div></section>
<section id="room" class="hidden">
 <div class="card stack room-hero"><div class="row room-code-row"><div><div class="kicker">ROOM CODE</div><div id="roomCode" class="big-number room-code">----</div></div><button id="leave" class="danger compact-button">退出</button></div><div id="readySummary" class="room-summary">参加者を待っています。</div><div id="players" class="players"></div></div>
 <div id="lobbyPanel" class="card stack"><label class="kicker" for="game">ゲーム</label><select id="game"><option value="reaction">REACTION</option><option value="stop_battle">STOP! BATTLE</option><option value="vote">VOTE</option><option value="majority">MAJORITY</option><option value="minority">MINORITY</option><option value="tic_tac">TIC-TAC</option><option value="word_wolf">WORD WOLF</option><option value="liar">LIAR</option><option value="draw">DRAW</option><option value="telephone">TELEPHONE</option></select><div id="gameInfo" class="game-info"><strong>REACTION</strong><span class="muted">ゲーム情報を読み込み中…</span></div><div class="row"><button id="ready" class="secondary">準備OK</button><button id="start">ゲーム開始</button></div></div>
 <div id="roundPanel" class="card stack hidden">
   <div id="reactionPanel" class="hidden big-center"><div class="kicker">REACTION</div><div id="reactionMessage" class="big-number">待機</div><button id="reactionTap">待って…</button></div>
   <div id="stopBattlePanel" class="hidden big-center"><div class="kicker">STOP! BATTLE</div><div id="stopBattleMessage" class="big-number">待機</div><div class="stop-track"><div id="stopBattleTarget" class="stop-target"></div><div id="stopBattleMarker" class="stop-marker"></div></div><button id="stopBattleButton">待って…</button></div>
   <div id="votePanel" class="hidden"><div class="kicker">VOTE</div><h2 id="votePrompt"></h2><div id="voteChoices" class="stack"></div></div>
   <div id="majorityPanel" class="hidden"><div id="majorityGameLabel" class="kicker">MAJORITY</div><h2 id="majorityPrompt"></h2><div id="majorityChoices" class="stack"></div></div>
   <div id="ticTacPanel" class="hidden"><div class="kicker">TIC-TAC</div><h2 id="ticTacStatus">待機中…</h2><div id="ticTacBoard" class="tic-tac-board"></div><div id="ticTacMeta" class="status compact-status">2人専用</div></div>
   <div id="deductionPanel" class="hidden"><div id="deductionGame" class="kicker">WORD WOLF</div><h2 id="deductionSecret"></h2><p id="deductionHint" class="muted"></p><div id="deductionChoices" class="stack"></div></div>
   <div id="drawPanel" class="hidden"><div class="kicker">DRAW</div><h2 id="drawPrompt">DRAWING…</h2><p id="drawProgress" class="muted"></p><canvas id="drawCanvas" width="360" height="260"></canvas><div id="drawDrawerControls" class="stack"><button id="drawClear" class="secondary">消去</button></div><div id="drawGuessControls" class="row"><input id="drawGuess" maxlength="40" placeholder="答えを入力"><button id="drawGuessSubmit">回答</button></div></div>
   <div id="telephonePanel" class="hidden"><div class="kicker">TELEPHONE</div><h2 id="telephoneStatus">待機中…</h2><p id="telephoneHint" class="muted"></p><div id="telephoneTextPrompt" class="status hidden"></div><canvas id="telephoneCanvas" class="hidden" width="360" height="260"></canvas><div id="telephoneDrawControls" class="stack hidden"><button id="telephoneClear" class="secondary">消去</button><button id="telephoneDrawSubmit">絵を送信</button></div><div id="telephoneTextControls" class="row hidden"><input id="telephoneText" maxlength="80" placeholder="絵から読み取った内容"><button id="telephoneTextSubmit">送信</button></div></div>
   <div id="resultsPanel" class="hidden"><div class="kicker">結果</div><div id="results" class="stack"></div></div>
   <button id="lobby" class="secondary hidden">ロビーに戻る</button>
 </div>
</section>
<details class="card settings-card"><summary><span><span class="kicker">SETTINGS</span><strong>設定</strong></span><span class="summary-chevron">⌄</span></summary><div class="settings-body"><label class="setting-row"><span>サウンド</span><input id="settingSound" type="checkbox" checked></label><label class="setting-row"><span>動きを抑える</span><input id="settingMotion" type="checkbox"></label></div></details>
</main>
<script src="../shared/errors.js"></script>
<script src="../shared/bridge.js"></script>
<script>
(()=>{
  let loaded=false;
  const loadApp=()=>{
    if(loaded)return;
    loaded=true;
    const script=document.createElement('script');
    script.src='./app.js';
    document.body.appendChild(script);
  };
  const devMode=!window.invokeNative;
  if(devMode){
    loadApp();
  }else{
    window.addEventListener('message',event=>{
      if(event.data==='componentsLoaded')loadApp();
    });
  }
})();
</script>
</body></html>
