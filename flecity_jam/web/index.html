<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self' https:; img-src 'self' data:; media-src 'self' blob:; object-src 'none'; base-uri 'none'">
  <title>Flecity JAM</title><link rel="stylesheet" href="style.css">
</head>
<body>
  <aside id="feedback" aria-label="JAMからのお知らせ">
    <div id="notice" role="status" hidden></div>
    <button id="retryBoot" type="button" hidden>JAMを再読み込み</button>
  </aside>
  <main id="panel" aria-label="JAM 演奏パネル" hidden>
    <header>
      <div class="brand"><span class="mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span><h1>JAM<span>FLECITY</span></h1></div>
      <div class="session-status"><span id="lamp" aria-hidden="true"></span><span id="status" role="status">楽器を選んで、演奏を始めよう。</span></div>
      <button id="compact" class="quiet" aria-expanded="true">縮小</button><button id="close" class="quiet">終了 <kbd>Esc</kbd></button>
    </header>
    <section class="controls" aria-label="演奏設定">
      <label class="instrument">楽器<select id="instrument"></select></label>
      <button id="start" class="primary">演奏する</button>
      <div class="octave"><span>オクターブ</span><div><button id="octDown" aria-label="1オクターブ下げる">−</button><output id="octave">4</output><button id="octUp" aria-label="1オクターブ上げる">＋</button></div></div>
      <button id="sustain" aria-pressed="false"><span>サステイン</span><strong id="pedalState">OFF</strong><kbd>Space</kbd></button>
      <label class="slider">演奏音量 <output id="performValue">75%</output><input id="performVolume" aria-label="演奏音量" type="range" min="0" max="100" value="75"></label>
      <label class="slider">聴く音量 <output id="listenValue">65%</output><input id="listenVolume" aria-label="聴く音量" type="range" min="0" max="100" value="65"></label>
      <button id="mute" class="quiet" aria-pressed="false">消音</button>
    </section>
    <div id="error" role="alert" hidden></div>
    <section id="playArea" tabindex="0" aria-label="楽器の鍵盤。表示されたPCキーで演奏" class="play-area">
      <div class="keyboard-caption"><span id="rangeText">C4 — F5</span><span id="playingText">鍵盤をクリックしても演奏できます</span><span id="voiceCount">0音</span></div>
      <div id="keyboard" class="keyboard" aria-label="鍵盤"></div>
    </section>
    <footer>
      <div class="hints"><span><kbd>Z</kbd><kbd>X</kbd> 音域</span><span><kbd>Space</kbd> ペダル</span><span id="nearby">周囲 0人</span><span id="rangeBadge">共有範囲 7m</span></div>
      <div class="actions"><button id="panic" class="quiet">すべての音を止める</button><button id="settingsToggle" class="quiet" aria-expanded="false" aria-controls="settings">キー設定・MIDI</button></div>
    </footer>
    <section id="settings" aria-label="キー設定とMIDI" hidden>
      <div class="settings-head"><h2>自分の弾きやすい配列に</h2><button id="resetKeys" class="quiet">標準配列に戻す</button></div>
      <p>変更したいキーを選び、新しいキーを押してください。Nは通常PTT用に予約されています。IMEはオフにしてください。</p>
      <div id="bindings"></div>
      <div class="settings-row"><button id="midiConnect">MIDIを接続</button><label>MIDI入力<select id="midiDevice" disabled><option>未接続</option></select></label><span id="midiStatus" role="status">対応環境でのみ利用できます</span></div>
      <div class="settings-row"><button id="metro" aria-pressed="false">メトロノーム OFF</button><label>テンポ <input id="bpm" type="number" min="40" max="240" value="100"></label><span>メトロノームは自分だけに聞こえます</span></div>
      <p>演奏中は移動とチャット入力を止めます。チャットはEscで演奏画面を閉じてから。ゲーム音声・無線の設定は変更しません。</p>
    </section>
  </main>
  <script type="module" src="app.mjs"></script>
</body>
</html>
