<!doctype html><html lang="ja"><head><meta charset="utf-8"><title>Flecity</title>
<style>html,body{margin:0;width:100%;height:100%;background:transparent}#window{position:fixed;inset:6vh 6vw;display:none;background:#101722;border:1px solid #526174;border-radius:18px;overflow:hidden;box-shadow:0 12px 60px #0008}iframe{width:100%;height:100%;border:0}</style></head>
<body><section id="window" role="dialog" aria-modal="true" aria-label="ゲーム大画面"><iframe id="game" title="ゲーム"></iframe></section><script>
const box=document.getElementById('window'),frame=document.getElementById('game');let current=null;
window.addEventListener('message',event=>{
 const d=event.data;if(!d||typeof d!=='object')return;
 if(event.source===frame.contentWindow){
  if(d.type==='screenLoaded'&&current)frame.contentWindow.postMessage({type:'screenImport',lease:current.lease,state:current.state},location.origin);
  return;
 }
 if(d.type==='screenOpen'&&['play','party'].includes(d.app)){
  current=d;frame.src='../'+d.app+'/index.html?surface=expanded&lease='+encodeURIComponent(d.lease);box.style.display='block';
 }else if(d.type==='screenHide'){current=null;box.style.display='none';frame.removeAttribute('src');}
 else if(current)frame.contentWindow.postMessage(d,location.origin);
});
</script></body></html>
