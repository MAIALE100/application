<!doctype html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>html,body{margin:0!important;background:transparent!important}body{visibility:hidden;pointer-events:none}body.frame-active{visibility:visible;pointer-events:auto}body.frame-active main{display:block}main{display:none}</style><link rel="stylesheet" href="app.css?v=20261019k"><title>FRAME</title></head><body><main><header><div><small>PHOTO EVENTS</small><h1>FRAME</h1></div><button id="refresh">↻</button></header><nav><button data-view="home">イベント</button><button data-view="mine">主催</button><button data-view="create">＋作成</button><button data-view="ads">広告</button><button data-view="staff" id="staffNav" hidden>管理</button></nav><section id="view"></section></main><script>
(()=>{
  let started=false;
  const start=()=>{
    if(started)return;
    started=true;
    document.body.classList.add('frame-active');
    const s=document.createElement('script');
    s.src='app.js?v=20261019k';
    document.body.appendChild(s);
  };
  window.addEventListener('message',(e)=>{
    if(e.data==='componentsLoaded') start();
  });
  if(!window.invokeNative) start();
})();
</script></body></html>
