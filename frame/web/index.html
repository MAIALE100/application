<!doctype html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>html,body{margin:0!important;background:transparent!important}body{visibility:hidden;pointer-events:none}body.frame-active{visibility:visible;pointer-events:auto}body.frame-active main{display:block}main{display:none}</style><link rel="stylesheet" href="app.css?v=20261020-v22"><title>FRAME</title></head><body><main><header><div><small>PHOTO EVENTS</small><h1>FRAME</h1></div><div class="header-actions"><button id="themeToggle" aria-label="テーマ変更">A</button><button id="refresh" aria-label="更新">↻</button></div></header><div id="themeMenu" class="theme-menu" hidden><button data-theme-choice="a"><b>A</b><span>Gallery</span><small>クリーン高級</small></button><button data-theme-choice="b"><b>B</b><span>Social</span><small>モダンSNS</small></button><button data-theme-choice="c"><b>C</b><span>Noir</span><small>ダーク高級</small></button></div><nav><button data-view="home">イベント</button><button data-view="mine">主催</button><button data-view="create">＋作成</button><button data-view="ads">広告</button><button data-view="staff" id="staffNav" hidden>管理</button></nav><section id="view"></section></main><script>
(()=>{
  let started=false;
  const start=()=>{
    if(started)return;
    started=true;
    const storedTheme=localStorage.getItem('frame.theme');
    document.body.dataset.theme=['a','b','c'].includes(storedTheme)?storedTheme:'a';
    document.body.classList.add('frame-active');
    const s=document.createElement('script');
    s.src='app.js?v=20261020-v223';
    document.body.appendChild(s);
  };
  window.addEventListener('message',(e)=>{
    if(e.data==='componentsLoaded') start();
  });
  if(!window.invokeNative) start();
})();
</script></body></html>
