<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PuriBooth Surface</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff}
#surface{width:100%;height:100%;background-size:cover;background-position:center;background-repeat:no-repeat}
.pink{background:
radial-gradient(circle at 20% 25%,rgba(255,255,255,.95) 0 3%,transparent 3.2%),
radial-gradient(circle at 78% 72%,rgba(255,255,255,.78) 0 2.6%,transparent 2.8%),
linear-gradient(135deg,#ffd3e9,#ff9dcc 48%,#f7d6ff)}
.white{background:
linear-gradient(135deg,rgba(255,255,255,.96),rgba(245,241,247,.98)),
repeating-linear-gradient(45deg,rgba(255,187,221,.14) 0 16px,transparent 16px 32px)}
.black{background:
radial-gradient(circle at 50% 20%,rgba(255,91,177,.22),transparent 36%),
linear-gradient(135deg,#18121a,#2d1b2b 55%,#131217)}
.y2k{background:
radial-gradient(circle at 12% 18%,rgba(255,255,255,.95) 0 1.7%,transparent 1.9%),
radial-gradient(circle at 72% 35%,rgba(255,255,255,.9) 0 1.2%,transparent 1.4%),
linear-gradient(115deg,#ff73c6,#79e8ff 35%,#b79aff 67%,#fff37c)}
.hearts{background-color:#ffd7ea;background-image:
radial-gradient(circle at 25% 25%,#ff6cad 0 5%,transparent 5.5%),
radial-gradient(circle at 75% 75%,#ff97c8 0 5%,transparent 5.5%);
background-size:110px 110px}
.none{background:transparent}
</style>
</head>
<body>
<div id="surface"></div>
<script>
(() => {
    const surface = document.getElementById('surface')
    const params = new URLSearchParams(location.search)
    const preset = (params.get('preset') || 'pink').toLowerCase()
    const raw = params.get('url') || ''

    const safeUrl = value => {
        try {
            const u = new URL(value)
            return (u.protocol === 'https:' || u.protocol === 'http:') ? u.href : ''
        } catch {
            return ''
        }
    }

    const imageUrl = safeUrl(raw)
    if (imageUrl) {
        surface.style.backgroundImage = `url("${imageUrl.replace(/"/g, '%22')}")`
        surface.style.backgroundColor = '#fff'
        return
    }

    const allowed = new Set(['pink','white','black','y2k','hearts','none'])
    surface.className = allowed.has(preset) ? preset : 'pink'
})()
</script>
</body>
</html>
