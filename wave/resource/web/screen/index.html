<!doctype html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WAVE 大画面</title>
<style>html,body{margin:0;width:100%;height:100%;background:transparent}#window{position:fixed;inset:4vh 4vw;display:none;background:#07101f;border:1px solid #526174;border-radius:18px;overflow:hidden;box-shadow:0 12px 60px #000a}iframe{width:100%;height:100%;border:0}@media(max-width:700px){#window{inset:1vh 1vw;border-radius:8px}}</style></head>
<body><section id="window" role="dialog" aria-modal="true" aria-label="WAVE 大画面"><iframe id="waveFrame" title="WAVE"></iframe></section><script>
const box=document.getElementById('window'),frame=document.getElementById('waveFrame');let current=null;
window.addEventListener('message',event=>{
 const data=event.data;if(!data||typeof data!=='object')return;
 if(event.source===frame.contentWindow){if(data.type==='waveScreenLoaded'&&current)frame.contentWindow.postMessage({type:'waveScreenImport',lease:current.lease,state:current.state},location.origin);return;}
 if(data.type==='waveScreenOpen'){current=data;frame.src='../index.html?surface=expanded&lease='+encodeURIComponent(data.lease);box.style.display='block';}
 else if(data.type==='waveScreenHide'){current=null;box.style.display='none';frame.removeAttribute('src');}
});
</script><script src="../sample-engine.js"></script><script src="../articulation.js"></script><script src="../synth-engine.js"></script><script src="../ringtone-core.js"></script><script src="../background-player.js"></script><script>
const resourceName=typeof GetParentResourceName==='function'?GetParentResourceName():'wave';
fetch('https://'+resourceName+'/wave:ringtoneReady',{method:'POST',headers:{'Content-Type':'application/json; charset=UTF-8'},body:'{}'}).catch(()=>{});
</script></body></html>
